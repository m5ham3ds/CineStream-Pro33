name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Pre-cache Gradle Wrapper
        run: |
          WRAPPER_DIR="$HOME/.gradle/wrapper/dists/gradle-9.3.1-bin/23ovyewtku6u96viwx3xl3oks"
          mkdir -p "$WRAPPER_DIR"
          if [ ! -f "$WRAPPER_DIR/gradle-9.3.1-bin.zip.ok" ]; then
            echo "Pre-fetching Gradle 9.3.1 wrapper to prevent network timeout..."
            curl -fsSL --retry 5 --retry-connrefused --retry-delay 3 \
              -o "$WRAPPER_DIR/gradle-9.3.1-bin.zip" \
              "https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip" || true
          fi

      - name: Setup google-services.json
        run: |
          echo "" | base64 -d > app/google-services.json

      - name: Setup Keystore
        run: |
          echo "" | base64 -d > debug.keystore
      - name: Build Debug APK
        env:
          WEB_CLIENT_ID: "979447256418-rjb9a0991gvve0328n113dme67i4gpv2.apps.googleusercontent.com"
        run: ./gradlew assembleDebug || gradle assembleDebug

      - name: Rename APK
        run: |
          # Rename the generated APK to CineStream.apk
          mv app/build/outputs/apk/debug/app-debug.apk CineStream.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream
          path: CineStream.apk
